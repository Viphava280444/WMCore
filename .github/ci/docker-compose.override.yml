# Fork-runner override, used together with the vendored docker-compose.yml.
#
# dmwm/WMCore-Jenkins is a private repository, so the image entrypoint cannot
# clone it at container start (it does: git clone .../WMCore-Jenkins, then
# cp -r WMCore-Jenkins/{TestScripts,ContainerScripts} into /home/cmsbld).
# Instead, a clone kept on the runner VM is mounted read-only at the same
# place; the entrypoint's failed clone is harmless and its cp -r then copies
# the scripts from the mount. Private code never leaves the CERN VM.
#
# Not needed upstream: dmwm runners can clone the repo directly.
#
# Parallel stacks: N test stacks coexist on one VM. The vendored compose uses
# host networking (the DBs bind host 3306/5984, so a second stack collides).
# Here each stack gets a PRIVATE network namespace: mariadb owns it (bridge)
# and couchdb + the test container JOIN it (network_mode service:mariadb), so
# the test script's hardcoded 127.0.0.1/localhost still reaches its OWN
# databases, isolated per stack. Same-target volume entries replace the
# vendored ones, giving each stack its own /tmp (the mariadb socket lives
# there) and its own RAM data dir. Container names carry the compose project
# name, which also ends the "couchdb"/"mariadb" global name squatting.
# Per-stack knobs (all defaulted, so a single-stack run needs none):
#   COMPOSE_PROJECT_NAME, HOST_MOUNT_DIR, WMCI_MDB_DATA_DIR, WMCI_NET,
#   WMCI_PROXY, WMCI_CI_DIR

# the generated passwd/group (setup-users.sh) replace the host files by
# mount target, so containers can resolve the sssd runner account
x-wmj-mount: &wmj-mount
  volumes:
    - "${WMCORE_JENKINS_HOST_DIR:-/data/vkhlaisu/WMCore-Jenkins}:/home/cmsbld/WMCore-Jenkins:ro"
    - "${HOST_MOUNT_DIR}/admin/etc/passwd:/etc/passwd:ro"
    - "${HOST_MOUNT_DIR}/admin/etc/group:/etc/group:ro"

# the test containers (PR tests and baseline) join their stack's namespace and
# reach the internet through the stack's own host proxy
x-stack-test: &stack-test
  network_mode: "service:mariadb"
  depends_on:
    - mariadb
    - egress-shim
  # docker on this VM programs no NAT (iptables:false), so bridge containers
  # have no direct egress; a small proxy on the HOST provides it. Set at
  # container level so the image entrypoint's git clone works too. DB
  # traffic (localhost) stays direct via no_proxy.
  environment:
    http_proxy: ${WMCI_PROXY:-}
    https_proxy: ${WMCI_PROXY:-}
    HTTP_PROXY: ${WMCI_PROXY:-}
    HTTPS_PROXY: ${WMCI_PROXY:-}
    no_proxy: "localhost,127.0.0.1"
    NO_PROXY: "localhost,127.0.0.1"
  volumes:
    - "${WMCORE_JENKINS_HOST_DIR:-/data/vkhlaisu/WMCore-Jenkins}:/home/cmsbld/WMCore-Jenkins:ro"
    - "${HOST_MOUNT_DIR}/admin/etc/passwd:/etc/passwd:ro"
    - "${HOST_MOUNT_DIR}/admin/etc/group:/etc/group:ro"
    - "${HOST_MOUNT_DIR}/tmp:/tmp"

services:
  # MariaDB data on a RAM disk: the tests recreate and wipe the database after
  # every test, which is sync-write-bound on the VM's virtio disk (measured:
  # 45+ min per slice vs Jenkins' 30-min budget). The long-form mount below
  # has the same target as the bind in the vendored file, so it replaces it.
  # The database is throwaway per run - losing it on stop is the point.
  mariadb:
    # the vendored file pins network_mode host; !reset removes that key so
    # the custom network below can take effect (conflicting keys otherwise)
    network_mode: !reset null
    # A custom network, not the default bridge: this VM's docker daemon has
    # ip masquerade DISABLED on the default bridge (container egress dies) and
    # the host resolver is a loopback stub (127.0.0.53) that the default
    # bridge cannot use. A per-project network re-enables masquerade and gets
    # Docker's embedded DNS; explicit dns: entries are the CERN resolvers as
    # a fallback (from /run/systemd/resolve/resolv.conf on vocms047).
    networks:
      - stacknet
    dns:
      - 137.138.16.5
      - 137.138.17.5
    container_name: ${COMPOSE_PROJECT_NAME:-wmci}-mariadb
    volumes:
      - "${HOST_MOUNT_DIR}/admin/etc/passwd:/etc/passwd:ro"
      - "${HOST_MOUNT_DIR}/admin/etc/group:/etc/group:ro"
      # same target as the vendored bind, so it replaces it: database on the
      # host RAM disk, pre-created by setup-env-gha.sh with runner ownership
      - "${WMCI_MDB_DATA_DIR:-/dev/shm/wmci-mariadb-${MY_ID}}:/data/srv/mariadb/current/install/database"
      - "${HOST_MOUNT_DIR}/tmp:/tmp"

  couchdb:
    network_mode: "service:mariadb"
    container_name: ${COMPOSE_PROJECT_NAME:-wmci}-couchdb
    depends_on:
      - mariadb
    volumes:
      - "${HOST_MOUNT_DIR}/admin/etc/passwd:/etc/passwd:ro"
      - "${HOST_MOUNT_DIR}/admin/etc/group:/etc/group:ro"
      - "${HOST_MOUNT_DIR}/tmp:/tmp"

  # firewall-free egress: the VM's nftables drops all container<->host IP
  # traffic, so this sidecar (same netns as the stack) listens on
  # 127.0.0.1:3128 and pipes into a bind-mounted unix socket served by
  # ci-proxy.py on the host - a filesystem path netfilter never sees
  egress-shim:
    image: registry.cern.ch/cmsweb/wmcore-dev:${WMCORE_DEV_TAG}
    user: ${MY_ID}:${MY_GROUP}
    network_mode: "service:mariadb"
    depends_on:
      - mariadb
    entrypoint: ["python3", "/wmci/ci-shim.py", "127.0.0.1:3128", "/tmp/wmci-egress.sock"]
    volumes:
      - "${WMCI_CI_DIR:-.}/ci-shim.py:/wmci/ci-shim.py:ro"
      - "${HOST_MOUNT_DIR}/tmp:/tmp"

  wmcore-pr-test:
    <<: *stack-test
  wmcore-unittests:
    <<: *stack-test
  # lint needs no databases, so it keeps the vendored host networking
  wmcore-pr-pylint:
    <<: *wmj-mount

networks:
  stacknet:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.enable_ip_masquerade: "true"
    # pinned subnet so the bridge gateway IP is known BEFORE the network
    # exists: the host egress proxy is addressed at the gateway, and traffic
    # to it never leaves the bridge. WMCI_NET makes it unique per stack.
    ipam:
      driver: default
      config:
        - subnet: "172.30.${WMCI_NET:-90}.0/24"
          gateway: "172.30.${WMCI_NET:-90}.1"
