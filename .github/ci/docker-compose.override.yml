# Fork-runner override, used with the vendored docker-compose.yml.
#
# WMCore-Jenkins is private, so the entrypoint's clone fails at container
# start. A clone on the runner VM is mounted read-only at the same path
# instead; the failed clone is harmless. Not needed upstream.
#
# Parallel stacks: each stack gets its own network namespace (mariadb owns
# it, couchdb and the test container join it) so DBs on multiple stacks
# don't collide. Same-target volumes give each stack its own /tmp and RAM
# data dir. Per-stack env (all optional): COMPOSE_PROJECT_NAME,
# HOST_MOUNT_DIR, WMCI_MDB_DATA_DIR, WMCI_NET, WMCI_PROXY, WMCI_CI_DIR

# the generated passwd/group (setup-users.sh) replace the host files by
# mount target, so containers can resolve the sssd runner account
x-wmj-mount: &wmj-mount
  volumes:
    - "${WMCORE_JENKINS_HOST_DIR:-/data/vkhlaisu/WMCore-Jenkins}:/home/cmsbld/WMCore-Jenkins:ro"
    - "${HOST_MOUNT_DIR}/admin/etc/passwd:/etc/passwd:ro"
    - "${HOST_MOUNT_DIR}/admin/etc/group:/etc/group:ro"

# the test containers (PR tests and baseline) join their stack's namespace and
# reach the internet through the stack's own host proxy
x-stack-test: &stack-test
  network_mode: "service:mariadb"
  depends_on:
    - mariadb
    - egress-shim
  # Bridge containers have no direct egress here, so a proxy on the HOST
  # provides it. Set at container level so the entrypoint's git clone
  # works too. DB traffic (localhost) stays direct via no_proxy.
  environment:
    http_proxy: ${WMCI_PROXY:-}
    https_proxy: ${WMCI_PROXY:-}
    HTTP_PROXY: ${WMCI_PROXY:-}
    HTTPS_PROXY: ${WMCI_PROXY:-}
    no_proxy: "localhost,127.0.0.1"
    NO_PROXY: "localhost,127.0.0.1"
  volumes:
    - "${WMCORE_JENKINS_HOST_DIR:-/data/vkhlaisu/WMCore-Jenkins}:/home/cmsbld/WMCore-Jenkins:ro"
    - "${HOST_MOUNT_DIR}/admin/etc/passwd:/etc/passwd:ro"
    - "${HOST_MOUNT_DIR}/admin/etc/group:/etc/group:ro"
    - "${HOST_MOUNT_DIR}/tmp:/tmp"

services:
  # MariaDB data on a RAM disk: tests recreate and wipe the DB every run,
  # which is too slow on real disk. The mount below has the same target as
  # the vendored bind, so it replaces it. Losing the DB on stop is fine -
  # it's throwaway per run.
  mariadb:
    # the vendored file pins network_mode host; !reset removes that key so
    # the custom network below can take effect (conflicting keys otherwise)
    network_mode: !reset null
    # Custom network, not the default bridge: this VM's default bridge has
    # ip masquerade disabled (no egress) and can't reach the host's loopback
    # DNS stub. A per-project network re-enables masquerade and gets
    # Docker's DNS; the dns: entries below are a fallback.
    networks:
      - stacknet
    dns:
      - 137.138.16.5
      - 137.138.17.5
    container_name: ${COMPOSE_PROJECT_NAME:-wmci}-mariadb
    volumes:
      - "${HOST_MOUNT_DIR}/admin/etc/passwd:/etc/passwd:ro"
      - "${HOST_MOUNT_DIR}/admin/etc/group:/etc/group:ro"
      # same target as the vendored bind, so it replaces it: database on the
      # host RAM disk, pre-created by setup-env-gha.sh with runner ownership
      - "${WMCI_MDB_DATA_DIR:-/dev/shm/wmci-mariadb-${MY_ID}}:/data/srv/mariadb/current/install/database"
      - "${HOST_MOUNT_DIR}/tmp:/tmp"

  couchdb:
    network_mode: "service:mariadb"
    container_name: ${COMPOSE_PROJECT_NAME:-wmci}-couchdb
    depends_on:
      - mariadb
    volumes:
      - "${HOST_MOUNT_DIR}/admin/etc/passwd:/etc/passwd:ro"
      - "${HOST_MOUNT_DIR}/admin/etc/group:/etc/group:ro"
      - "${HOST_MOUNT_DIR}/tmp:/tmp"

  # Firewall-free egress: the VM blocks container<->host IP traffic, so
  # this sidecar listens on 127.0.0.1:3128 and pipes to a unix socket
  # served on the host - a filesystem path the firewall never sees.
  egress-shim:
    image: registry.cern.ch/cmsweb/wmcore-dev:${WMCORE_DEV_TAG}
    user: ${MY_ID}:${MY_GROUP}
    network_mode: "service:mariadb"
    depends_on:
      - mariadb
    entrypoint: ["python3", "/wmci/ci-shim.py", "127.0.0.1:3128", "/tmp/wmci-egress.sock"]
    volumes:
      - "${WMCI_CI_DIR:-.}/ci-shim.py:/wmci/ci-shim.py:ro"
      - "${HOST_MOUNT_DIR}/tmp:/tmp"

  wmcore-pr-test:
    <<: *stack-test
  wmcore-unittests:
    <<: *stack-test
  # lint needs no databases, so it keeps the vendored host networking
  wmcore-pr-pylint:
    <<: *wmj-mount

networks:
  stacknet:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.enable_ip_masquerade: "true"
    # pinned subnet so the bridge gateway IP is known BEFORE the network
    # exists: the host egress proxy is addressed at the gateway, and traffic
    # to it never leaves the bridge. WMCI_NET makes it unique per stack.
    ipam:
      driver: default
      config:
        - subnet: "172.30.${WMCI_NET:-90}.0/24"
          gateway: "172.30.${WMCI_NET:-90}.1"
