# WMCore PR report: posts the "GitHub Actions results:" comment and the commit
# statuses for a completed "WMCore PR tests" run.
#
# Why a separate workflow: a fork pull_request run holds a read-only token,
# but this base-repo workflow_run always gets a write token, fork PRs included.
#
# Security contract: never checks out or executes PR code, only parses its
# artifacts; the pr-context artifact is untrusted, so its PR number must be
# plain digits and match the head SHA the test run actually tested.

name: WMCore PR report

on:
  workflow_run:
    workflows: ["WMCore PR tests"]
    types: [completed]
  # manual door: testing, or re-posting a report for a finished test run
  workflow_dispatch:
    inputs:
      run_id:
        description: 'Run id of a completed "WMCore PR tests" run'
        required: true
      pr_number:
        description: 'PR number that run tested'
        required: true
      conclusion:
        description: 'How that run ended (cancelled/timed_out get a terminal status instead of a report); empty = completed'
        required: false

permissions:
  contents: read
  statuses: write
  issues: write
  pull-requests: write
  actions: read

env:
  BUILD_ID: ${{ github.run_id }}
  # the PR comment links here; the trailing '#' keeps the path the script
  # appends a harmless fragment
  BUILD_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}#
  # vendored CI scripts (.github/ci/scripts), checked out from master below
  WMCI_SCRIPTS_DIR: ${{ github.workspace }}/wmcore-src/.github/ci/scripts

jobs:
  report:
    # success AND failure produce a full report (as in the previous CI, the
    # report posts even when tests failed). A cancelled or timed-out run has no
    # results to report, but it does leave the begin job's 'pending' status
    # behind, so it gets a terminal status instead of silence.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success' ||
      github.event.workflow_run.conclusion == 'failure' ||
      github.event.workflow_run.conclusion == 'cancelled' ||
      github.event.workflow_run.conclusion == 'timed_out'
    # GitHub-hosted on purpose: this job only needs python, the artifacts and
    # the GitHub API. On the single self-hosted runner it queued behind every
    # waiting test job (up to 52 min observed), so PR comments arrived late.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # the vendored CI scripts; always master's copy, never PR code
      - name: Checkout CI scripts from master
        uses: actions/checkout@v4
        with:
          ref: master
          path: wmcore-src

      # Which test run, which PR. On dispatch both come from inputs; on
      # workflow_run the PR number comes from the pr-context artifact, since
      # the event payload omits fork PRs (validated as in the header).
      - name: Resolve which test run to report on
        id: ctx
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # inputs go through env, never inline in the script (injection guard)
          RUN_ID_IN: ${{ inputs.run_id }}
          PR_IN: ${{ inputs.pr_number }}
          CONCL_IN: ${{ inputs.conclusion }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            test_run_id="$RUN_ID_IN"
          else
            test_run_id='${{ github.event.workflow_run.id }}'
          fi
          case "$test_run_id" in ''|*[!0-9]*) echo "run id is not a number ('$test_run_id')"; exit 1;; esac
          # Digits alone are not enough. A maintainer pasting a BASELINE run id
          # from the Actions list would have this job compare that baseline
          # against itself - no pr-context, so the PR head is taken as the
          # tested commit, 14/14 slices on both sides, zero new failures - and
          # post a green verdict on a commit nothing tested. Refuse a run that
          # is not a finished run of the PR test workflow.
          run_json=$(curl -sf --retry 3 --retry-all-errors -H "Authorization: Bearer $GH_TOKEN" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/runs/${test_run_id}")
          wf_path=$(printf '%s' "$run_json" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("path",""))')
          run_status=$(printf '%s' "$run_json" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("status",""))')
          if [ "$wf_path" != ".github/workflows/wmcore-pr-test.yml" ]; then
            echo "run ${test_run_id} belongs to '${wf_path}', not the PR test workflow - refusing"
            exit 1
          fi
          if [ "$run_status" != "completed" ]; then
            echo "run ${test_run_id} is '${run_status}', not completed - refusing to report on it"
            exit 1
          fi
          # The run's own pr-context is the only record of WHICH commit was
          # tested, so read it on every path, the manual one included.
          pr=''
          tested_sha=''
          rm -rf pr-context pr-context.zip
          # --retry, like the POSTs below: this whole step is the only thing
          # that can turn the begin job's pending status into a terminal one,
          # and under bash -e one transient 5xx on any of these reads aborted
          # it before a single output was written, leaving the PR pending with
          # nothing left to re-drive it.
          art_url=$(curl -sf --retry 3 --retry-all-errors -H "Authorization: Bearer $GH_TOKEN" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/runs/${test_run_id}/artifacts?per_page=100" \
            | python3 -c 'import json,sys; m=[a for a in json.load(sys.stdin)["artifacts"] if a["name"]=="pr-context"]; print(m[0]["archive_download_url"] if m else "")')
          if [ -n "$art_url" ]; then
            curl -sfL -H "Authorization: Bearer $GH_TOKEN" -o pr-context.zip "$art_url"
            python3 -c 'import zipfile; zipfile.ZipFile("pr-context.zip").extractall("pr-context")'
            pr=$(tr -d '[:space:]' < pr-context/pr-number.txt)
            if [ -f pr-context/pr-head-sha.txt ]; then
              tested_sha=$(tr -d '[:space:]' < pr-context/pr-head-sha.txt)
            fi
          fi
          if [ -z "$pr" ]; then
            if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
              echo "No pr-context on run ${test_run_id} - using the dispatch input, with no tested SHA"
              pr="$PR_IN"
            else
              echo "No pr-context artifact on run ${test_run_id} (guard-skipped or pre-split run) - nothing to report"
              echo "should=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          case "$pr" in ''|*[!0-9]*) echo "pr-context is not a plain number ('$pr') - refusing"; exit 1;; esac
          if [ -n "$tested_sha" ] && ! printf '%s' "$tested_sha" | grep -qE '^[0-9a-f]{40}$'; then
            echo "pr-context head SHA is not a commit SHA ('$tested_sha') - refusing"
            exit 1
          fi
          head_sha=$(curl -sf --retry 3 --retry-all-errors -H "Authorization: Bearer $GH_TOKEN" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/pulls/${pr}" \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["head"]["sha"])')
          # (i) the artifact is untrusted: what it claims must be what the run
          # really ran on. Loud, as before - this is the tampering guard.
          if [ "$GITHUB_EVENT_NAME" = "workflow_run" ] && [ "${{ github.event.workflow_run.event }}" = "pull_request" ]; then
            claimed="${tested_sha:-$head_sha}"
            if [ "$claimed" != "${{ github.event.workflow_run.head_sha }}" ]; then
              echo "pr-context names PR ${pr} (commit ${claimed}) but the test run tested ${{ github.event.workflow_run.head_sha }}."
              echo "Either tampering or a push landed between test and report - refusing to post."
              exit 1
            fi
          fi
          # (ii) a push after the tests is normal, not an attack: the results
          # simply describe a commit that is no longer the head. Say so and stop.
          if [ -n "$tested_sha" ] && [ "$tested_sha" != "$head_sha" ]; then
            echo "PR head moved after the tests: tested ${tested_sha}, head now ${head_sha}; nothing posted, the new head needs its own run"
            echo "should=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "PR_NUMBER=${pr}" >> "$GITHUB_ENV"
          echo "PR_HEAD_SHA=${tested_sha:-$head_sha}" >> "$GITHUB_ENV"
          # An aborted run has no results, so there is no report to build - but
          # the commit is now known, which is all the terminal status below
          # needs. Everything else in this job is gated on should=true.
          # On the dispatch door there is no workflow_run payload, so the test
          # run's own handoff reports how it ended. Without that, a cancelled
          # requested run looked 'completed' here and the 'pending' status on
          # the PR never got a terminal state.
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            concl="$CONCL_IN"
          else
            concl='${{ github.event.workflow_run.conclusion }}'
          fi
          echo "test-run-url=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${test_run_id}" >> "$GITHUB_OUTPUT"
          case "$concl" in
            cancelled|timed_out|skipped)
              echo "the test run ended '${concl}' - posting a terminal status instead of a report"
              echo "conclusion=${concl}" >> "$GITHUB_OUTPUT"
              echo "aborted=true" >> "$GITHUB_OUTPUT"
              echo "should=false" >> "$GITHUB_OUTPUT"
              exit 0;;
          esac
          echo "should=true" >> "$GITHUB_OUTPUT"
          echo "test-run-id=${test_run_id}" >> "$GITHUB_OUTPUT"
          echo "Reporting on test run ${test_run_id} for PR ${pr} (commit ${tested_sha:-$head_sha})"

      # The begin job's 'pending' status is the only mark on the PR for a run
      # that never reached this report. Without a terminal state it stays
      # pending forever and the PR looks like it is still testing.
      - name: Report an aborted test run
        if: steps.ctx.outputs.aborted == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # from the ctx step, so this works on both doors (the workflow_run
          # payload is empty on a dispatched handoff)
          CONCLUSION: ${{ steps.ctx.outputs.conclusion }}
          TEST_RUN_URL: ${{ steps.ctx.outputs.test-run-url }}
        run: |
          curl -sf --retry 3 --retry-all-errors -X POST -H "Authorization: Bearer $GH_TOKEN" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/statuses/${PR_HEAD_SHA}" \
            -d "{\"state\": \"error\", \"target_url\": \"${TEST_RUN_URL}\", \"description\": \"Test run ${CONCLUSION} at $(date -u '+%d %b %Y %H:%M GMT')\"}"
          echo "posted an 'error' status on ${PR_HEAD_SHA}: the test run ended '${CONCLUSION}'"

      # Last resort. If the step above never ran because the ctx step itself
      # died (an API read that failed past its retries, an unreadable
      # pr-context), no output was written, so every should/aborted-gated step
      # below is skipped and the 'pending' status would stay on the PR with
      # nothing to re-drive it. Post a terminal state on the commit the tests
      # ran on - which on this door is by definition the workflow_run head, the
      # same commit the pending status sits on. Only this door: a manual
      # dispatch that fails for an unrelated reason must not stamp a PR.
      - name: Post a terminal status if the context step died
        if: failure() && github.event_name == 'workflow_run' && steps.ctx.outputs.should == '' && steps.ctx.outputs.aborted == ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TESTED_SHA: ${{ github.event.workflow_run.head_sha }}
          TEST_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          curl -sf --retry 3 --retry-all-errors -X POST -H "Authorization: Bearer $GH_TOKEN" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/statuses/${TESTED_SHA}" \
            -d "{\"state\": \"error\", \"target_url\": \"${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\", \"description\": \"Report could not resolve the test run at $(date -u '+%d %b %Y %H:%M GMT')\"}"
          echo "posted an 'error' status on ${TESTED_SHA}: this report could not resolve the test run."
          echo "To recover, re-run the report workflow by hand with run_id=${TEST_RUN_ID} and the PR number."

      # A hosted runner starts clean; the rm keeps this step correct if the job
      # ever moves back to a persistent workspace.
      - name: Set up report environment
        if: steps.ctx.outputs.should == 'true'
        run: |
          rm -rf report-venv LatestUnitTests LatestPylint MasterUnitTests artifacts UnstableTests.txt report-stdout.txt
          python3 -m venv report-venv
          report-venv/bin/pip -q install jinja2 xunitparser PyGithub
          curl -sf -o UnstableTests.txt \
            "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/master/test/etc/UnstableTests.txt"
          mkdir -p artifacts

      # these two tolerate missing artifacts: PullRequestReport.py skips report
      # sections it has no input for. The baseline fetch below stays strict.
      - name: Fetch PR test results (LatestUnitTests)
        if: steps.ctx.outputs.should == 'true'
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: nosetests-slice-*
          path: LatestUnitTests
          run-id: ${{ steps.ctx.outputs.test-run-id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Fetch lint results (LatestPylint)
        if: steps.ctx.outputs.should == 'true'
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: lint-reports
          path: LatestPylint
          run-id: ${{ steps.ctx.outputs.test-run-id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # An empty changedFiles.txt is legitimate (a PR touching no python file),
      # so a report file alone cannot tell "nothing to lint" from "the lint run
      # died half way". pylintPRTest.sh writes lint-status.txt only when it ran
      # to the end; without it, drop the report so PullRequestReport.py skips
      # the Py3 Pylint verdict instead of publishing a green one.
      - name: Require a complete lint run
        if: steps.ctx.outputs.should == 'true'
        run: |
          if [ -f LatestPylint/pylintpy3Report.json ] && [ ! -f LatestPylint/lint-status.txt ]; then
            echo "::warning::the lint run did not finish (no lint-status.txt) - no Py3 Pylint verdict will be posted"
            mv LatestPylint/pylintpy3Report.json LatestPylint/pylintpy3Report.json.incomplete
          fi

      # previous CI: the latest successful baseline run's artifacts.
      # The runs API does not guarantee ordering (seen live: the first item
      # was a 15-day-old run), so fetch a page and pick the newest here, and
      # refuse a stale baseline rather than compare against an old environment.
      - name: Find latest successful baseline run
        if: steps.ctx.outputs.should == 'true'
        id: baseline
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MAX_AGE_HOURS: ${{ vars.WMCI_BASELINE_MAX_AGE_HOURS || 36 }}
        run: |
          curl -sf --retry 3 --retry-all-errors -H "Authorization: Bearer $GH_TOKEN" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/workflows/wmcore-baseline.yml/runs?status=success&per_page=30" \
            > baseline-runs.json
          python3 - <<'EOF'
          import json, os, sys
          from datetime import datetime, timezone
          runs = [r for r in json.load(open('baseline-runs.json'))['workflow_runs']
                  if r.get('conclusion') == 'success']
          if not runs:
              sys.exit("No successful baseline run found. Run the 'WMCore baseline' workflow first.")
          newest = max(runs, key=lambda r: r['created_at'])
          created = datetime.fromisoformat(newest['created_at'].replace('Z', '+00:00'))
          age_h = (datetime.now(timezone.utc) - created).total_seconds() / 3600
          print(f"Using baseline from run {newest['id']} (created {newest['created_at']}, "
                f"age {age_h:.1f} h, sha {newest['head_sha'][:9]}, {len(runs)} candidates)")
          max_age = float(os.environ['MAX_AGE_HOURS'])
          if age_h > max_age:
              sys.exit(f"Newest successful baseline is {age_h:.1f} h old (limit {max_age:.0f} h). "
                       "Fix or dispatch the 'WMCore baseline' workflow before trusting PR verdicts.")
          with open(os.environ['GITHUB_OUTPUT'], 'a') as fh:
              fh.write(f"run-id={newest['id']}\n")
              fh.write(f"created={newest['created_at']}\n")
              fh.write(f"age-hours={age_h:.1f}\n")
          EOF

      - name: Fetch baseline results (MasterUnitTests)
        if: steps.ctx.outputs.should == 'true'
        uses: actions/download-artifact@v4
        with:
          pattern: nosetests-slice-*
          path: MasterUnitTests
          run-id: ${{ steps.baseline.outputs.run-id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # A partial run must never reach PullRequestReport.py: with slices
      # missing it posts green statuses from the wreckage. Fail here instead.
      - name: Require complete results (all 14 slices, both sides)
        if: steps.ctx.outputs.should == 'true'
        run: |
          python3 - <<'EOF'
          import glob, re, sys
          for side in ('LatestUnitTests', 'MasterUnitTests'):
              seen = set()
              for f in glob.glob(side + '/*/nosetestspy3-*.xml'):
                  m = re.search(r'nosetestspy3-(\d+)-', f.rsplit('/', 1)[-1])
                  if m:
                      seen.add(int(m.group(1)))
              missing = sorted(set(range(14)) - seen)
              if missing:
                  sys.exit(side + ': missing result XML for slices '
                           + str(missing) + ' - refusing to report from a partial run')
              print(side + ': all 14 slices present')
          EOF

      # twin of "Generate Reports": jinja templates from the vendored scripts
      # dir, with the delta-aware pylint gate patched in at runtime.
      - name: Generate report and update PR (PullRequestReport.py)
        if: steps.ctx.outputs.should == 'true'
        env:
          DMWMBOT_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WMCORE_REPO: ${{ github.repository_owner }}
          CODE_REPO: WMCore
          WMCI_TEMPLATE_PATH: ${{ env.WMCI_SCRIPTS_DIR }}/templates
        run: |
          # patch-pylint-delta.py rewrites the file it is given, so work on a
          # throwaway copy and leave the checked-out script untouched.
          cp "$WMCI_SCRIPTS_DIR/ContainerScripts/PullRequestReport.py" \
             "$RUNNER_TEMP/PullRequestReport.py"
          # Delta-aware pylint gate (fail only on NEW W/E). It comes from the
          # same checkout as the script it patches: the raw.githubusercontent
          # copy was a needless network dependency that aborts this step under
          # bash -e, and its CDN cache could serve a patcher older than the
          # PullRequestReport.py it is anchored to.
          python3 "$WMCI_SCRIPTS_DIR/../patch-pylint-delta.py" "$RUNNER_TEMP/PullRequestReport.py"
          # tee the output: the run-summary step reads the printed summary
          # dict instead of recomputing the gate. pipefail keeps a crash fatal.
          set -o pipefail
          report-venv/bin/python "$RUNNER_TEMP/PullRequestReport.py" 2>&1 | tee report-stdout.txt

      - name: Upload PR report
        if: always() && steps.ctx.outputs.should == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: pr-report
          path: artifacts/PullRequestReport.html
          if-no-files-found: warn

      # flips the "default" status (set to pending by the begin job) to the
      # outcome of this report job.
      - name: Finish default status (report job outcome)
        if: always() && steps.ctx.outputs.should == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          state=failure
          [ "${{ job.status }}" = "success" ] && state=success
          # --retry: without it a transient 5xx after the server committed the
          # write turns the whole run red although the status was posted
          curl -sf --retry 3 --retry-all-errors -X POST -H "Authorization: Bearer $GH_TOKEN" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/statuses/${PR_HEAD_SHA}" \
            -d "{\"state\": \"${state}\", \"target_url\": \"${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\", \"description\": \"Build finished at $(date -u '+%d %b %Y %H:%M GMT')\"}"

      # Run-page summary: the same facts as the PR comment, plus the names of
      # the tests behind the counts, so nobody has to download the artifact for
      # the common questions. The verdict is quoted from PullRequestReport.py's
      # printed dict, never recomputed. Rendering problems only warn.
      - name: Write run summary
        if: always() && steps.ctx.outputs.should == 'true'
        env:
          BASELINE_RUN: ${{ steps.baseline.outputs.run-id }}
          BASELINE_CREATED: ${{ steps.baseline.outputs.created }}
          BASELINE_AGE_H: ${{ steps.baseline.outputs.age-hours }}
        run: |
          python3 - <<'EOF' || echo "::warning::run-summary rendering failed; the PR comment and statuses are unaffected"
          import ast, glob, html, os, re
          try:
              from defusedxml import ElementTree as ET
          except ImportError:
              import xml.etree.ElementTree as ET

          tests = failures = errors = skipped = 0
          for f in glob.glob('LatestUnitTests/**/nosetests*.xml', recursive=True):
              try:
                  root = ET.parse(f).getroot()
              except Exception:
                  continue
              for s in ([root] if root.tag == 'testsuite' else root.findall('testsuite')):
                  tests += int(s.get('tests', 0)); failures += int(s.get('failures', 0))
                  errors += int(s.get('errors', 0)); skipped += int(s.get('skip', s.get('skipped', 0)))

          out = ''
          try:
              out = open('report-stdout.txt', encoding='utf-8', errors='replace').read()
          except Exception:
              pass

          gate = None
          try:
              m = re.search(r'Python3 Unit Test summary (\{.*\})', out)
              gate = ast.literal_eval(m.group(1)) if m else None
          except Exception:
              pass

          # names behind the counts, from the rendered report
          sections = {}
          try:
              text = open('artifacts/PullRequestReport.html', encoding='utf-8', errors='replace').read()
              text = re.sub(r'\s+', ' ', html.unescape(re.sub(r'<[^>]+>', ' ', text)))
              heads = ['New failures of unit tests', 'Unit tests added', 'Unit tests deleted',
                       'Unstable unit tests changed', 'Changed unit tests', 'Summary of Python3 pylint report',
                       'Warnings from pylint by file and severity', 'Warnings from pycodestyle']
              pos = sorted([(text.find(h), h) for h in heads if text.find(h) >= 0])
              for i, (p, h) in enumerate(pos):
                  end = pos[i + 1][0] if i + 1 < len(pos) else len(text)
                  sections[h] = text[p + len(h):end]
          except Exception:
              pass

          # One extractor per phrasing: the template writes "changed from X to
          # Y" only in the flip sections, "was added with status X" in the
          # added one and "(X) was deleted" in the deleted one - so the single
          # flip pattern silently returned nothing for added/deleted, and
          # those two headings could never render for any PR.
          NAME = r'([A-Za-z0-9_.]+:[A-Za-z0-9_]+)'

          def flips(key):
              return re.findall(NAME + r' changed from (\w+) to (\w+)', sections.get(key, ''))

          def adds(key):
              return re.findall(NAME + r' was added with status (\w+)', sections.get(key, ''))

          def dels(key):
              return re.findall(NAME + r' \((\w+)\) was deleted', sections.get(key, ''))

          pr = os.environ.get('PR_NUMBER', '?'); sha = os.environ.get('PR_HEAD_SHA', '')[:9]
          L = ['## WMCore PR test results: PR #%s, commit `%s`' % (pr, sha), '']
          # Quote the markers PullRequestReport.py prints, which are the same
          # flags that drive the commit statuses. The counter dict carries no
          # 'failed' flag: a test that exists only on the PR side and errors
          # sets it while newFailures stays 0, and a pylint-only failure never
          # touches the dict at all - so a verdict derived from newFailures
          # printed PASS beside a red status on the same commit.
          counters = ' (report counters: `%s`)' % gate if gate is not None else ''
          markers = ('DMWM-FAIL-PY3-UNIT', 'DMWM-SUCCEED-PY3-UNIT',
                     'DMWM-FAIL-PYLINTPY3', 'DMWM-SUCCEED-PYLINTPY3')
          if any(mk in out for mk in markers):
              # a missing marker means that side did not run: neither pass nor fail
              bad = [name for name, failed in (('unit tests', 'DMWM-FAIL-PY3-UNIT' in out),
                                               ('pylint', 'DMWM-FAIL-PYLINTPY3' in out)) if failed]
              L.append('**Verdict: %s**%s' % (
                  'PASS' if not bad else 'FAIL (%s)' % ', '.join(bad), counters))
          else:
              L.append('**Verdict unavailable**: the report step printed no status markers; the commit statuses are the authority.')
          if os.environ.get('BASELINE_RUN'):
              L.append('Baseline: run %s, created %s, age %s h' % (
                  os.environ['BASELINE_RUN'], os.environ.get('BASELINE_CREATED', '?'), os.environ.get('BASELINE_AGE_H', '?')))
          L += ['', '| Tests | Failures | Errors | Skipped |', '|---|---|---|---|',
                '| %d | %d | %d | %d |' % (tests, failures, errors, skipped), '',
                'Failures and errors that also occur on master do not count; only tests that pass on master and fail here do.', '']
          for title, key, extract in (
                  ('New failures (must be resolved)', 'New failures of unit tests', flips),
                  ('Tests no longer failing', 'Changed unit tests', flips),
                  ('Unstable tests that flipped (forgiven)', 'Unstable unit tests changed', flips),
                  ('Tests added', 'Unit tests added', adds),
                  ('Tests deleted', 'Unit tests deleted', dels)):
              items = extract(key)
              if items:
                  L += ['### %s: %d' % (title, len(items))]
                  L += ['- `%s` (%s)' % (t[0], ' to '.join(t[1:])) for t in items]
                  L += ['']
          py = sections.get('Summary of Python3 pylint report', '').strip()
          if py:
              L += ['### Pylint', py[:700].strip(), '']
          if os.path.exists('LatestPylint/pep8py3.txt'):
              L.append('pycodestyle: %d comments to review (informational)' % sum(1 for _ in open('LatestPylint/pep8py3.txt')))
          L += ['', 'Full report: artifact `pr-report` on this run.']
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as out:
              out.write('\n'.join(L) + '\n')
          EOF
